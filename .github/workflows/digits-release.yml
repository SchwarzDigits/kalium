name: Digits release

# Publishes a release of this fork as schwarz.opensource.natrium:<module>:<tag> to the fork's Maven repository, the
# STACKIT Object Storage bucket natrium-repository. A release is a tag on a release branch digits/<Wire version>, named
# <Wire version>-digits.<n>, e.g. 0.0.7-digits.3. See FORK.md.

on:
  push:
    tags:
      - "*-digits.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. 0.0.7-digits.3"
        required: true
        type: string
      overwrite:
        description: "Replace files of this release that are already in the repository, e.g. after a failed upload"
        required: false
        type: boolean
        default: false

# One release at a time: each one reads, merges and writes the maven-metadata.xml files.
concurrency:
  group: digits-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the Maven repository
    if: github.repository == 'SchwarzDigits/kalium'
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      OVERWRITE: ${{ inputs.overwrite || false }}
      REPOSITORY_URL: https://natrium-repository.object.storage.eu01.onstackit.cloud
      S3_ENDPOINT: https://object.storage.eu01.onstackit.cloud
      S3_BUCKET: natrium-repository
      STAGING_REPOSITORY: build/maven-central-staging
    steps:
      - name: Check the secrets
        env:
          MAVEN_REPOSITORY_ACCESS_KEY_ID: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          MAVEN_REPOSITORY_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          SIGNING_IN_MEMORY_KEY_ID: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MAVEN_REPOSITORY_ACCESS_KEY_ID MAVEN_REPOSITORY_SECRET_ACCESS_KEY SIGNING_IN_MEMORY_KEY_ID \
            SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.1.0"

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag
        run: |
          case "$RELEASE_TAG" in
            *-digits.*) ;;
            *)
              echo "::error::Release tags are named <Wire version>-digits.<n>: $RELEASE_TAG"
              exit 1
              ;;
          esac
          version="${RELEASE_TAG%-digits.*}"
          if ! git merge-base --is-ancestor HEAD "origin/digits/$version"; then
            echo "::error::$RELEASE_TAG is not on the release branch digits/$version"
            exit 1
          fi

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Write the init script for this fork's coordinates
        run: |
          cat > "$RUNNER_TEMP/digits-publishing.init.gradle.kts" <<'INIT'
          import org.gradle.api.publish.PublishingExtension
          import org.gradle.api.publish.maven.MavenPublication

          // Publishes Kalium from this fork with the fork's POM data. It runs after the build's own
          // publishing setup, so its values win.
          //
          // The group is NOT set here: it has to be in place while the projects are configured, so it is
          // passed as -Pkalium.publish.group below. Setting it from projectsEvaluated leaves each module's
          // kotlin-project-structure-metadata.json pointing at com.wire.kalium, which breaks commonMain
          // metadata compilation for consumers.
          gradle.projectsEvaluated {
              allprojects {
                  val publishing = extensions.findByType(PublishingExtension::class.java) ?: return@allprojects
                  val module = path.removePrefix(":").replace(':', '-')
                  publishing.publications.withType(MavenPublication::class.java).configureEach {
                      pom {
                          description.set("Kalium KMP messaging SDK, fork of wireapp/kalium (module: $module)")
                          url.set("https://github.com/SchwarzDigits/kalium")
                          developers {
                              developer {
                                  id.set("schwarzdigits")
                                  name.set("Schwarz Digits")
                              }
                          }
                          scm {
                              connection.set("scm:git:https://github.com/SchwarzDigits/kalium.git")
                              developerConnection.set("scm:git:ssh://git@github.com/SchwarzDigits/kalium.git")
                              url.set("https://github.com/SchwarzDigits/kalium")
                          }
                      }
                  }
              }
          }
          INIT

      - name: Publish Gradle publications to local staging repository
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          # USE_UNIFIED_CORE_CRYPTO as in Wire's own publishing of these releases; later versions ignore it.
          ./gradlew --init-script "$RUNNER_TEMP/digits-publishing.init.gradle.kts" \
            publishAllPublicationsToMavenCentralStagingRepository \
            -PUSE_UNIFIED_CORE_CRYPTO=true \
            -Pkalium.publish.group=schwarz.opensource.natrium \
            -Pkalium.publish.version="$RELEASE_TAG" \
            -Pkalium.mavenCentral.signingRequired=true

      - name: Check that the release is not in the repository yet
        run: |
          test -d "$STAGING_REPOSITORY"
          # Released files are never replaced, unless the input overwrite is set.
          (cd "$STAGING_REPOSITORY" && find . -type f -name '*.pom' | sed 's#^\./##') \
            | xargs -P 16 -n 1 sh -c 'code="$(curl -s -o /dev/null -w "%{http_code}" "$REPOSITORY_URL/$1")"; \
                [ "$code" = 404 ] || echo "$1 $code"' _ > "$RUNNER_TEMP/existing.txt"
          if [ -s "$RUNNER_TEMP/existing.txt" ]; then
            cat "$RUNNER_TEMP/existing.txt"
            if [ "$OVERWRITE" != "true" ]; then
              echo "::error::$RELEASE_TAG is already in the repository, at least in part. Run the workflow by hand with overwrite to replace it."
              exit 1
            fi
            echo "::warning::Replacing files of $RELEASE_TAG that are already in the repository"
          fi

      - name: Merge the maven-metadata.xml files with the repository
        run: |
          # The staging repository only knows this release. Each artifact's maven-metadata.xml gets the versions that
          # are already in the repository, so tools that look for new versions still see all of them.
          python3 - "$STAGING_REPOSITORY" "$REPOSITORY_URL" "$RELEASE_TAG" <<'PY'
          import datetime, hashlib, os, sys, urllib.error, urllib.request
          import xml.etree.ElementTree as ET

          staging, repository_url, release = sys.argv[1:4]
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M%S")
          for directory, _, files in os.walk(staging):
              if "maven-metadata.xml" not in files:
                  continue
              path = os.path.join(directory, "maven-metadata.xml")
              url = repository_url + "/" + os.path.relpath(path, staging)
              metadata = ET.parse(path)
              versioning = metadata.getroot().find("versioning")
              versions = versioning.find("versions")
              try:
                  with urllib.request.urlopen(url) as response:
                      published = [v.text for v in ET.fromstring(response.read()).iter("version") if v.text]
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  published = []
              versions.clear()
              for version in [v for v in published if v != release] + [release]:
                  ET.SubElement(versions, "version").text = version
              versioning.find("latest").text = release
              versioning.find("release").text = release
              versioning.find("lastUpdated").text = now
              ET.indent(metadata, space="  ")
              metadata.write(path, encoding="UTF-8", xml_declaration=True)
              content = open(path, "rb").read()
              for algorithm in ("md5", "sha1", "sha256", "sha512"):
                  with open(path + "." + algorithm, "w") as checksum:
                      checksum.write(hashlib.new(algorithm, content).hexdigest())
          PY

      - name: Upload to the Maven repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu01
          AWS_EC2_METADATA_DISABLED: "true"
          # STACKIT Object Storage doesn't need the additional checksums newer AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          command -v aws > /dev/null || brew install awscli
          aws --version
          # The artifacts first, the maven-metadata.xml files last, so they never name a version that isn't there.
          aws s3 cp "$STAGING_REPOSITORY" "s3://$S3_BUCKET" --recursive --only-show-errors \
            --endpoint-url "$S3_ENDPOINT" --exclude "*maven-metadata.xml*"
          aws s3 cp "$STAGING_REPOSITORY" "s3://$S3_BUCKET" --recursive --only-show-errors \
            --endpoint-url "$S3_ENDPOINT" --exclude "*" --include "*maven-metadata.xml*"

      - name: Check the release in the repository
        run: |
          group_path=schwarz/opensource/natrium
          for file in "logic/$RELEASE_TAG/logic-$RELEASE_TAG.pom" "logic/$RELEASE_TAG/logic-$RELEASE_TAG.module" \
            "logic/maven-metadata.xml"; do
            curl --fail --silent --show-error --head --output /dev/null "$REPOSITORY_URL/$group_path/$file"
          done
          curl --fail --silent --show-error "$REPOSITORY_URL/$group_path/logic/maven-metadata.xml" \
            | grep -q "<version>$RELEASE_TAG</version>"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Maven repository"
            echo "**Version**: ${RELEASE_TAG}"
            echo "**Repository**: ${REPOSITORY_URL}"
            echo
            echo '```kotlin'
            echo "repositories {"
            echo "    maven(\"${REPOSITORY_URL}\")"
            echo "}"
            echo "dependencies {"
            echo "    implementation(\"schwarz.opensource.natrium:logic:${RELEASE_TAG}\")"
            echo "}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
